# Unit tests, the MCP server end to end, and the eval harness self-test (oracle/null/perturbed
# answerers through the real grader). data/vb.duckdb is not in the repo, so SQL cases skip here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install duckdb==1.4.5 numpy==2.0.2 scipy==1.13.1 pytest mcp==2.3.0
      - run: python -m pytest -q tests
      - run: python -m evals.run --selftest
